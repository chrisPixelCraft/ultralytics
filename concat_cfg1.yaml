data: concat.yaml
model: yolo11x.pt
epochs: 100
imgsz: [1920,1080]
batch: 4
device: 0
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: True
momentum: 0.937
weight_decay: 0.001
warmup_epochs: 10
patience: 10
dfl: 2.0 # imbalance class
cache: True
amp: True



hsv_h: 0.015  # Hue adjustment range (-25° to +13°)
hsv_s: 0.7    # Saturation adjustment range
hsv_v: 0.4    # Exposure adjustment range
mosaic: 1.0   # Enable mosaic augmentation
translate: 0.15     # Consider adding translation augmentation
scale: 0.6       # Consider adding scale augmentation
mixup: 0.15
copy_paste: 0.15

